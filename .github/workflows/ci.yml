name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero dependencies
        run: |
          python - <<'PY'
          import ast, os, sys

          # 与 tests/engine/test_stdlib_only.py 同判据：标准库 ∪ 本工程同目录 .py
          # （只比 stdlib 会把 example_ruleset / _config 这类本地模块误判成第三方）
          SCAN_DIRS = ["checks", "harness", "harness/hooks", "harness/agents", "guardrail_engine", "agentguard"]
          local = set()
          for d in SCAN_DIRS:
              if os.path.isdir(d):
                  local.update(fn[:-3] for fn in os.listdir(d) if fn.endswith(".py"))
                  # 包目录本身也是合法导入名（guardrail_engine / agentguard），
                  # 只收 .py 文件名会把 `from guardrail_engine import ...` 误判成第三方。
                  if os.path.isfile(os.path.join(d, "__init__.py")):
                      local.add(d.split("/")[0])

          stdlib = set(getattr(sys, "stdlib_module_names", ()))
          offenders = []
          for d in SCAN_DIRS:
              if not os.path.isdir(d):
                  continue
              for fn in sorted(os.listdir(d)):
                  if not fn.endswith(".py"):
                      continue
                  path = os.path.join(d, fn)
                  with open(path, encoding="utf-8") as fh:
                      tree = ast.parse(fh.read())
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          mods = [a.name.split(".")[0] for a in node.names]
                      elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                          mods = [node.module.split(".")[0]]
                      else:
                          continue
                      for m in mods:
                          if m not in stdlib and m not in local:
                              offenders.append(f"{path}: {m}")
          if offenders:
              print("FAIL: third-party imports found:")
              for o in offenders:
                  print("  " + o)
              sys.exit(1)
          print("OK: all imports are stdlib or in-project modules")
          PY

      - name: Validate config
        run: |
          python harness/run_gate.py --validate

      - name: Run fast tests
        run: |
          python sandbox/run_tests.py --fast

      - name: Run unit tests
        run: |
          set -o pipefail
          python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tee /tmp/unittest.log
          if grep -qE "ResourceWarning|Exception ignored in" /tmp/unittest.log; then
            echo "发现未关闭的句柄泄漏（见上方日志）" >&2
            exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version: "3.12"

      - name: Validate config
        run: python harness/run_gate.py --validate

      - name: Run fast tests
        run: python sandbox/run_tests.py --fast

  provenance:
    runs-on: ubuntu-latest
    steps:
      # 检查的是**被测提交本身**：PR 事件下 checkout@v4 默认落在合并预览提交，
      # 那条消息由 GitHub 生成、不含作者写的尾注，校验会永远跳过。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version: "3.12"

      # 只校验 HEAD 一条提交：判据是「这条提交里的引擎内容 = 它自己声明的 sha」。
      # 不校验历史（历史里的提交早已在各自的 CI 里过一遍），也不要求每个提交都带尾注。
      - name: Verify Engine-Sha trailer on [harness] HEAD
        run: |
          MSG="$(git log -1 --format=%B)"
          case "$MSG" in
            *"[harness]"*) ;;
            *) echo "HEAD 无 [harness] 标记，跳过引擎尾注校验"; exit 0 ;;
          esac
          WANT="$(printf '%s\n' "$MSG" | sed -n 's/^Engine-Sha:[[:space:]]*\([0-9a-f]\{16\}\)[[:space:]]*$/\1/p' | tail -1)"
          if [ -z "$WANT" ]; then
            echo "✗ 该提交带 [harness] 但缺 Engine-Sha 尾注。" >&2
            echo "  在提交消息末尾加一行：Engine-Sha: $(python harness/run_gate.py --engine-sha)" >&2
            exit 1
          fi
          GOT="$(python harness/run_gate.py --engine-sha)"
          if [ "$WANT" != "$GOT" ]; then
            echo "✗ 尾注声明 $WANT，按本提交内容实算 $GOT。" >&2
            echo "  说明：提交后又改了引擎内容，或尾注抄错了。改正尾注（amend）或补一个提交。" >&2
            exit 1
          fi
          echo "✓ 尾注与实算一致：$GOT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile checks/*.py harness/*.py guardrail_engine/*.py agentguard/*.py

      - name: Verify UTF-8 encoding
        run: |
          python -c "
          import os, sys
          for root, dirs, files in os.walk('.'):
              if '.git' in root or '__pycache__' in root:
                  continue
              for f in files:
                  if f.endswith('.py') or f.endswith('.md') or f.endswith('.toml') or f.endswith('.yaml'):
                      path = os.path.join(root, f)
                      try:
                          with open(path, encoding='utf-8') as fh:
                              fh.read()
                      except UnicodeDecodeError as e:
                          print(f'FAIL: {path} is not valid UTF-8: {e}')
                          sys.exit(1)
          print('OK: all text files are valid UTF-8')
          "
