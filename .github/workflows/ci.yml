name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero dependencies
        run: |
          python - <<'PY'
          import ast, os, sys

          # 与 tests/test_stdlib_only.py 同判据：标准库 ∪ 本工程同目录 .py
          # （只比 stdlib 会把 example_ruleset / _config 这类本地模块误判成第三方）
          SCAN_DIRS = ["checks", "harness", "harness/hooks", "harness/agents", "agentguard"]
          local = set()
          for d in SCAN_DIRS:
              if os.path.isdir(d):
                  local.update(fn[:-3] for fn in os.listdir(d) if fn.endswith(".py"))

          stdlib = set(getattr(sys, "stdlib_module_names", ()))
          offenders = []
          for d in SCAN_DIRS:
              if not os.path.isdir(d):
                  continue
              for fn in sorted(os.listdir(d)):
                  if not fn.endswith(".py"):
                      continue
                  path = os.path.join(d, fn)
                  with open(path, encoding="utf-8") as fh:
                      tree = ast.parse(fh.read())
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          mods = [a.name.split(".")[0] for a in node.names]
                      elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                          mods = [node.module.split(".")[0]]
                      else:
                          continue
                      for m in mods:
                          if m not in stdlib and m not in local:
                              offenders.append(f"{path}: {m}")
          if offenders:
              print("FAIL: third-party imports found:")
              for o in offenders:
                  print("  " + o)
              sys.exit(1)
          print("OK: all imports are stdlib or in-project modules")
          PY

      - name: Validate config
        run: |
          python harness/run_gate.py --validate

      - name: Run fast tests
        run: |
          python sandbox/run_tests.py --fast

      - name: Run unit tests
        run: |
          set -o pipefail
          python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tee /tmp/unittest.log
          if grep -qE "ResourceWarning|Exception ignored in" /tmp/unittest.log; then
            echo "发现未关闭的句柄泄漏（见上方日志）" >&2
            exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate config
        run: python harness/run_gate.py --validate

      - name: Run fast tests
        run: python sandbox/run_tests.py --fast

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile checks/*.py harness/*.py agentguard/*.py

      - name: Verify UTF-8 encoding
        run: |
          python -c "
          import os, sys
          for root, dirs, files in os.walk('.'):
              if '.git' in root or '__pycache__' in root:
                  continue
              for f in files:
                  if f.endswith('.py') or f.endswith('.md') or f.endswith('.toml') or f.endswith('.yaml'):
                      path = os.path.join(root, f)
                      try:
                          with open(path, encoding='utf-8') as fh:
                              fh.read()
                      except UnicodeDecodeError as e:
                          print(f'FAIL: {path} is not valid UTF-8: {e}')
                          sys.exit(1)
          print('OK: all text files are valid UTF-8')
          "
