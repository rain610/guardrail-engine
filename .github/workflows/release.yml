name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # 单一构建点：发布链只在这里跑一次 `python -m build`。
  # release 与 publish 都下载同一个 artifact，禁止任何一侧重新构建 —— 否则
  # GitHub Release 的 wheel/sdist 与 PyPI 上的不再是同一份字节。
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version: "3.12"

      - name: 校验 tag ↔ VERSION 一致
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "tag $TAG 与 VERSION $VERSION 不一致" >&2
            exit 1
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tee /tmp/unittest.log
          if grep -qE "ResourceWarning|Exception ignored in" /tmp/unittest.log; then
            echo "发现未关闭的句柄泄漏（见上方日志）" >&2
            exit 1
          fi

      - name: 变异冒烟（锁真的有牙齿）
        run: python sandbox/mutation_smoke.py

      - name: 构建 sdist + wheel（唯一构建点）
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          # 只把公开发布物放进 dist/pypi；内部安装包留在 dist/install-package。
          # publish 只上传 dist/pypi，避免把 stage 里的轮子重复上传。
          mkdir -p dist/pypi
          mv dist/*.whl dist/*.tar.gz dist/pypi/
          N_WHEEL=$(find dist/pypi -maxdepth 1 -name '*.whl' | wc -l)
          N_SDIST=$(find dist/pypi -maxdepth 1 -name '*.tar.gz' | wc -l)
          if [ "$N_WHEEL" -ne 1 ] || [ "$N_SDIST" -ne 1 ]; then
            echo "期望恰好一个 wheel + 一个 sdist，实际 wheel=$N_WHEEL sdist=$N_SDIST" >&2
            exit 1
          fi

      - name: 用同一 wheel 组装离线安装包
        run: |
          set -- dist/pypi/*.whl
          if [ "$#" -ne 1 ]; then
            echo "期望恰好一个 wheel，实际 $# 个" >&2
            exit 1
          fi
          python sandbox/pack_release.py --wheel "$1"
          python sandbox/verify_release.py

      - name: 真产物锁（必须在 pack 之后跑，否则 TestRealArtifactPasses 会 skip）
        run: python tests/packaging/test_release_artifact.py TestRealArtifactPasses -v

      - name: 上传构建产物（release / publish 共用）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag: v7.0.2
        with:
          name: release-dist
          # 只传下游真要用的东西：公开发布物、出货件目录、出货 zip。
          # `dist/install-package/_wheel*/` 是打包器的一次性构建缓存 —— 内容就是 dist/pypi
          # 里那份 wheel 的又一份副本（`--wheel` 复用它）。v4 会把整个 dist/ 压成一个 zip，
          # 多带一份白占体积与上传时间，而下游一个字节都用不到。
          path: |
            dist/
            !dist/install-package/_wheel*/
          # 默认 `false` 会默默跳过以 `.` 开头的路径 —— 而出货件里恰好有三处：
          # `marketplace/.claude-plugin/marketplace.json`、`plugins/agentguard/.claude-plugin/`、
          # `plugins/agentguard/.mcp.json`。漏掉它们，release job 的 verify_release 会以
          # “产物不完整”告终（更糟的是万一校验没盖到，就发了个缺件的包）。
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # release 只消费 artifact：下载、复验、创建 GitHub Release。
  # 注意：它既不重跑 build，也不重新打包；GitHub 附件与 PyPI 是同一份 wheel/sdist。
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version: "3.12"

      - name: 下载构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # tag: v4
        with:
          name: release-dist
          path: dist

      - name: 确认 artifact 结构（fail-closed）
        run: |
          # 下载层级写错时，后面的 verify/twine 会以“找不到文件”告终 —— 那句话不指向根因。
          for p in dist/pypi dist/install-package; do
            if [ ! -d "$p" ]; then
              echo "artifact 解出来的结构不对：缺少 $p（下载层级多了一层？）" >&2
              find dist -maxdepth 3 -type d | head -30 >&2
              exit 1
            fi
          done

      - name: 校验下载产物
        run: |
          N_WHEEL=$(find dist/pypi -maxdepth 1 -name '*.whl' | wc -l)
          N_SDIST=$(find dist/pypi -maxdepth 1 -name '*.tar.gz' | wc -l)
          if [ "$N_WHEEL" -ne 1 ] || [ "$N_SDIST" -ne 1 ]; then
            echo "下载产物不是恰好一个 wheel + 一个 sdist（wheel=$N_WHEEL sdist=$N_SDIST）" >&2
            exit 1
          fi
          python sandbox/verify_release.py
          python tests/packaging/test_release_artifact.py TestRealArtifactPasses -v

      - name: 干净 venv 安装冒烟（验证 wheel 自带引擎）
        run: |
          python -m venv /tmp/ag-venv
          set -- dist/pypi/*.whl
          if [ "$#" -ne 1 ]; then
            echo "期望恰好一个 wheel，实际 $# 个" >&2
            exit 1
          fi
          /tmp/ag-venv/bin/python -m pip install --no-index --no-deps --disable-pip-version-check "$1"
          # 轮子自带引擎：init 会把副本落盘，并在内部跑一次 run_gate --list 自检。
          # 不再用 GUARDRAIL_ENGINE_DIR 指向检出目录 —— 那样即使 wheel 漏带引擎也会假绿。
          ENGINE="/tmp/ag-engine"
          /tmp/ag-venv/bin/guardrail-engine init --dir "$ENGINE"
          if [ ! -f "$ENGINE/.guardrail-engine-init.json" ]; then
            echo "init 没写下所有权标记：$ENGINE/.guardrail-engine-init.json" >&2
            exit 1
          fi
          GOT="$(GUARDRAIL_ENGINE_DIR="$ENGINE" /tmp/ag-venv/bin/guardrail-engine --version | tr -d '[:space:]')"
          WANT="$(tr -d '[:space:]' < VERSION)"
          if [ "$GOT" != "$WANT" ]; then
            echo "venv 里 guardrail-engine --version 输出 '$GOT'，VERSION 是 '$WANT'" >&2
            exit 1
          fi
          echo "OK: 干净 venv 安装后 init 落盘自带引擎，guardrail-engine --version = $GOT"

      - name: 创建 GitHub Release（同一个 wheel/sdist + 内部安装包）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/pypi/*.whl \
            dist/pypi/*.tar.gz \
            dist/install-package/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  # PyPI 可信发布（OIDC）：不用任何长期 token。首次发布前要在 PyPI 网页端登记
  # trusted publisher（project: guardrail-engine / owner: rain610 / repo: guardrail-engine /
  # workflow: release.yml / environment: pypi），见 docs/packaging/RUNBOOK.md。
  # publish 只下载 build 的 artifact，禁止重新构建。
  publish:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/guardrail-engine/
    permissions:
      contents: read      # checkout 需要
      id-token: write     # OIDC 换发短时上传凭证
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version: "3.12"

      - name: 下载构建产物（不重新构建）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # tag: v4
        with:
          name: release-dist
          path: dist

      - name: 确认 artifact 结构（fail-closed）
        run: |
          for p in dist/pypi dist/install-package; do
            if [ ! -d "$p" ]; then
              echo "artifact 解出来的结构不对：缺少 $p（下载层级多了一层？）" >&2
              find dist -maxdepth 3 -type d | head -30 >&2
              exit 1
            fi
          done

      - name: 校验并安装冒烟（同一份 wheel）
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/pypi/*
          python -m venv /tmp/pypi-venv
          set -- dist/pypi/*.whl
          if [ "$#" -ne 1 ]; then
            echo "期望恰好一个 wheel，实际 $# 个" >&2
            exit 1
          fi
          /tmp/pypi-venv/bin/python -m pip install --no-index --no-deps --disable-pip-version-check "$1"
          ENGINE="/tmp/pypi-engine"
          /tmp/pypi-venv/bin/guardrail-engine init --dir "$ENGINE"
          if [ ! -f "$ENGINE/.guardrail-engine-init.json" ]; then
            echo "init 没写下所有权标记：$ENGINE/.guardrail-engine-init.json" >&2
            exit 1
          fi
          GOT="$(GUARDRAIL_ENGINE_DIR="$ENGINE" /tmp/pypi-venv/bin/guardrail-engine --version | tr -d '[:space:]')"
          WANT="$(tr -d '[:space:]' < VERSION)"
          if [ "$GOT" != "$WANT" ]; then
            echo "venv 里 guardrail-engine --version 输出 '$GOT'，VERSION 是 '$WANT'" >&2
            exit 1
          fi
          echo "OK: sdist → wheel → init 自带引擎，guardrail-engine --version = $GOT"

      - name: 发布到 PyPI（同一份 dist/pypi）
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # tag: release/v1
        with:
          packages-dir: dist/pypi
