name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验 tag ↔ VERSION 一致
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "tag $TAG 与 VERSION $VERSION 不一致" >&2
            exit 1
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tee /tmp/unittest.log
          if grep -qE "ResourceWarning|Exception ignored in" /tmp/unittest.log; then
            echo "发现未关闭的句柄泄漏（见上方日志）" >&2
            exit 1
          fi

      - name: 变异冒烟（锁真的有牙齿）
        run: python sandbox/mutation_smoke.py

      - name: 构建 wheel + 离线安装包
        run: |
          python -m pip install --upgrade build
          python sandbox/pack_release.py
          # 只数**出货目录**里那一个 wheel：dist/install-package/_wheel/ 是构建缓存，
          # 递归 find 会把它一起数进来（本机实测 2 个）。
          STAGE="dist/install-package/agentguard-package-v$(tr -d '[:space:]' < VERSION)"
          N=$(find "$STAGE" -maxdepth 1 -name "*.whl" | wc -l)
          if [ "$N" -ne 1 ]; then
            echo "期望出货目录恰好一个 wheel，实际 $N 个（$STAGE）" >&2
            exit 1
          fi

      - name: 真产物锁（必须在 pack 之后跑，否则 TestRealArtifactPasses 会 skip）
        run: python tests/test_release_artifact.py TestRealArtifactPasses -v

      - name: 校验出货件
        run: |
          python sandbox/verify_release.py

      - name: 干净 venv 安装冒烟
        run: |
          python -m venv /tmp/ag-venv
          STAGE="dist/install-package/agentguard-package-v$(tr -d '[:space:]' < VERSION)"
          set -- "$STAGE"/*.whl
          if [ "$#" -ne 1 ]; then
            echo "出货目录里的 wheel 不是恰好一个（$# 个）：$STAGE" >&2
            exit 1
          fi
          /tmp/ag-venv/bin/python -m pip install --no-index --no-deps --disable-pip-version-check "$1"
          # 轮子只有壳，引擎仍在检出目录（INSTALL.md「零」）；给壳一个根再验入口。
          GOT="$(AGENTGUARD_DIR="$PWD" /tmp/ag-venv/bin/agentguard --version | tr -d '[:space:]')"
          WANT="$(tr -d '[:space:]' < VERSION)"
          if [ "$GOT" != "$WANT" ]; then
            echo "venv 里 agentguard --version 输出 '$GOT'，VERSION 是 '$WANT'" >&2
            exit 1
          fi
          echo "OK: 干净 venv 安装后 agentguard --version = $GOT"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/install-package/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
